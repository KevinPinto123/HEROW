# Backend de HEROW en Render (Blueprint).
# Las claves secretas (sync: false) se cargan en el dashboard de Render, nunca en git.
services:
  - type: web
    name: herow-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DEV_TOOLS
        value: "false"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_MODERATION_MODEL
        value: omni-moderation-latest
      - key: SCRAPE_CACHE_HOURS
        value: "12"
      # URL pública de este servicio y del frontend (Vercel), separadas por coma si hay varias.
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PORTAL_SECRET_KEY
        sync: false
